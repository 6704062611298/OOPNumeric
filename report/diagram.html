<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 640px; height: 500px; background: #fff; overflow: hidden; }
</style>
</head>
<body>
<svg width="640" height="500" viewBox="0 0 620 480" xmlns="http://www.w3.org/2000/svg" font-family="Leelawadee UI, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#1a2332"/></marker>
    <marker id="hollow" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0,6 L13,0 L13,12 Z" fill="#fff" stroke="#1a2332" stroke-width="1.4"/></marker>
  </defs>
  <style>
    .box { fill: #f4f7fa; stroke: #0b5c8f; stroke-width: 1.6; rx: 5; }
    .abs { fill: #e8f1f8; }
    .ttl { font-size: 15px; font-weight: 700; fill: #1a2332; }
    .stereotype { font-size: 11px; fill: #5a6b7c; font-style: italic; }
    .mem { font-size: 11.5px; fill: #33414f; }
    .rel { stroke: #1a2332; stroke-width: 1.4; fill: none; }
  </style>

  <!-- BaseMethod -->
  <rect class="box abs" x="215" y="18" width="190" height="86"/>
  <text class="stereotype" x="310" y="36" text-anchor="middle">&laquo;abstract&raquo;</text>
  <text class="ttl" x="310" y="55" text-anchor="middle">BaseMethod</text>
  <line x1="225" y1="63" x2="395" y2="63" stroke="#0b5c8f" stroke-width="1"/>
  <text class="mem" x="225" y="78"># meta</text>
  <text class="mem" x="225" y="94">+ solve(input) &laquo;abstract&raquo;</text>

  <!-- subclasses -->
  <rect class="box" x="18" y="200" width="130" height="66"/>
  <text class="ttl" x="83" y="224" text-anchor="middle">BisectionMethod</text>
  <line x1="28" y1="233" x2="138" y2="233" stroke="#0b5c8f" stroke-width="1"/>
  <text class="mem" x="28" y="250">+ solve()</text>

  <rect class="box" x="164" y="200" width="130" height="66"/>
  <text class="ttl" x="229" y="224" text-anchor="middle">NewtonRaphson</text>
  <text class="ttl" x="229" y="240" text-anchor="middle">Method</text>

  <rect class="box" x="310" y="200" width="130" height="66"/>
  <text class="ttl" x="375" y="224" text-anchor="middle">GaussElimination</text>
  <text class="ttl" x="375" y="240" text-anchor="middle">Method</text>

  <rect class="box" x="456" y="200" width="146" height="92"/>
  <text class="ttl" x="529" y="222" text-anchor="middle">DifferenceMethod</text>
  <line x1="466" y1="231" x2="592" y2="231" stroke="#0b5c8f" stroke-width="1"/>
  <text class="mem" x="466" y="248">- kind</text>
  <text class="mem" x="466" y="264">+ solve()</text>
  <text class="stereotype" x="529" y="284" text-anchor="middle">สร้าง 3 วัตถุ: fwd/bwd/central</text>

  <!-- inheritance arrows -->
  <line class="rel" x1="83" y1="200" x2="240" y2="104" marker-end="url(#hollow)"/>
  <line class="rel" x1="229" y1="200" x2="280" y2="104" marker-end="url(#hollow)"/>
  <line class="rel" x1="375" y1="200" x2="340" y2="104" marker-end="url(#hollow)"/>
  <line class="rel" x1="529" y1="200" x2="390" y2="104" marker-end="url(#hollow)"/>
  <text class="stereotype" x="150" y="150">สืบทอด (Inheritance)</text>

  <!-- registry -->
  <rect class="box" x="215" y="330" width="190" height="80"/>
  <text class="ttl" x="310" y="352" text-anchor="middle">registry.js</text>
  <line x1="225" y1="360" x2="395" y2="360" stroke="#0b5c8f" stroke-width="1"/>
  <text class="mem" x="225" y="376">- methods : Map</text>
  <text class="mem" x="225" y="392">+ register(m) / getMethod(key)</text>
  <text class="mem" x="225" y="408">+ listMethods()</text>

  <!-- composition arrows -->
  <line class="rel" x1="83" y1="266" x2="250" y2="330" marker-end="url(#arrow)"/>
  <line class="rel" x1="229" y1="266" x2="290" y2="330" marker-end="url(#arrow)"/>
  <line class="rel" x1="375" y1="266" x2="340" y2="330" marker-end="url(#arrow)"/>
  <line class="rel" x1="529" y1="292" x2="380" y2="352" marker-end="url(#arrow)"/>
  <text class="stereotype" x="430" y="325">ประกอบวัตถุ (Composition)</text>

  <!-- routes -->
  <rect class="box" x="215" y="440" width="190" height="34"/>
  <text class="ttl" x="310" y="462" text-anchor="middle">routes (REST API)</text>
  <line class="rel" x1="310" y1="440" x2="310" y2="414" marker-end="url(#arrow)"/>
</svg>
</body>
</html>
