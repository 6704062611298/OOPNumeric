# Nginx config สำหรับ FastNumeric frontend
# - เสิร์ฟ React SPA (ทุก path fallback ไป index.html สำหรับ react-router)
# - reverse proxy /api → backend container

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router — ส่งทุก path ที่ไม่ใช่ไฟล์จริงไปที่ index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy ไปยัง backend (ชื่อ service ใน docker-compose)
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
